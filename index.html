<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b0d"><meta name="description" content="Simulador presidencial do Brasil — escolha, governe e construa seu legado.">
  <title>Presidente do Brasil — Simulador</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app-shell">
  <header id="hud" class="hud hidden">
    <div class="stat"><span>🦅</span><div><small>Aprovação</small><b id="approval">50%</b></div></div>
    <div class="stat"><span>📈</span><div><small>Economia</small><b id="economy">50%</b></div></div>
    <div class="stat"><span>💵</span><div><small>Orçamento</small><b id="cash">R$ 750 bi</b></div></div>
    <div class="stat"><span>💎</span><div><small>Prestígio</small><b id="gems">20</b></div></div>
  </header>
  <main id="screen" aria-live="polite"></main>
  <nav id="nav" class="bottom-nav hidden"><button data-nav="home" aria-label="Palácio">🏛️</button><button data-nav="decisions" aria-label="Governo">📋</button><button data-nav="social" aria-label="Rede social">📱</button><button data-nav="profile" aria-label="Perfil">👤</button></nav>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="game.js"></script>
</body></html>
